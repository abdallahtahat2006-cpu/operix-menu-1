<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A0908">
    <meta name="description" content="Operix dashboard — menu, tables, QR codes, services and order settings for the restaurant.">
    <title>Dashboard · Lumière</title>

    <script>
        (function () {
            try {
                var theme = JSON.parse(localStorage.getItem('lum.theme')) || 'dark';
                var lang = JSON.parse(localStorage.getItem('lum.lang')) || 'ar';
                var root = document.documentElement;
                root.dataset.theme = theme;
                root.lang = lang;
                root.dir = lang === 'ar' ? 'rtl' : 'ltr';
            } catch (e) { /* markup defaults apply */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="console.css">
</head>
<body class="console page-admin">

    <div class="grain" aria-hidden="true"></div>

    <div class="c-shell">

        <header class="c-bar">
            <div class="c-brand">
                <span class="c-brand__name" id="brandName">Lumière</span>
                <span class="c-brand__role" data-ops="adminTitle"></span>
            </div>

            <span class="c-bar__spacer"></span>

            <a class="c-btn" href="index.html" target="_blank" rel="noopener">
                <span data-ic="phone"></span><span data-ops="openMenu"></span>
            </a>
            <a class="c-btn" href="staff.html">
                <span data-ic="monitor"></span><span data-ops="openStaff"></span>
            </a>
            <button class="c-btn c-btn--icon" id="langBtn" type="button">EN</button>
            <button class="c-btn c-btn--icon" id="themeBtn" type="button"></button>
        </header>

        <div class="c-body">
            <nav class="c-nav" id="nav" aria-label="Sections"></nav>
            <main class="c-pane" id="pane"></main>
        </div>

    </div>

    <!-- Dish / category editor -->
    <div class="cmodal" id="modal" role="dialog" aria-modal="true">
        <div class="cmodal__card">
            <div class="cmodal__head">
                <h2 class="cmodal__title"></h2>
                <button class="icon-mini modal-close" type="button" aria-label="Close"><span data-ic="x"></span></button>
            </div>
            <div class="cmodal__body"></div>
            <div class="cmodal__foot"></div>
        </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="icons.js"></script>
    <script src="data.js"></script>
    <script src="qr.js"></script>
    <script src="system.js"></script>
    <script src="console-core.js"></script>
    <script src="admin.js"></script>
</body>
</html>
