<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0C0A09">
    <meta name="description" content="Lumière — modern bistro. Wood fire, slow mornings, late nights. Browse the full menu.">
    <title>Lumière · Digital Menu</title>

    <!-- Restore the visitor's theme and language before first paint -->
    <script>
        (function () {
            try {
                var theme = JSON.parse(localStorage.getItem('lum.theme')) || 'dark';
                var lang = JSON.parse(localStorage.getItem('lum.lang')) || 'en';
                var root = document.documentElement;
                root.dataset.theme = theme;
                root.lang = lang;
                root.dir = lang === 'ar' ? 'rtl' : 'ltr';
            } catch (e) { /* defaults in the markup already apply */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-landing">

    <div class="grain" aria-hidden="true"></div>

    <!-- Hero -->
    <section class="hero">
        <div class="hero__media">
            <img src="assets/venue.png" alt="The dining room at Lumière" fetchpriority="high">
        </div>
        <div class="hero__scrim" aria-hidden="true"></div>

        <header class="topbar topbar--float">
            <div class="topbar__inner">
                <button class="table-chip" type="button" hidden></button>
                <span class="topbar__spacer"></span>
                <button class="icon-btn icon-btn--glass icon-btn--lang" id="langBtn" type="button">ع</button>
                <button class="icon-btn icon-btn--glass" id="themeBtn" type="button"></button>
                <button class="icon-btn icon-btn--glass cart-btn" id="cartBtn" type="button" data-i18n-label="yourOrder">
                    <span data-ic="basket"></span>
                    <span class="cart-btn__badge" id="cartBadge">0</span>
                </button>
            </div>
        </header>

        <div class="hero__inner">
            <span class="status" id="status"></span>
            <h1 class="hero__title" id="heroTitle">Lumière</h1>
            <div class="ornament" aria-hidden="true"><span></span></div>
            <p class="hero__tag" id="heroTag"></p>

            <nav class="social-row" aria-label="Social">
                <a class="social-pill" href="#"><span data-ic="instagram"></span> Instagram</a>
                <a class="social-pill" href="#"><span data-ic="tiktok"></span> TikTok</a>
                <a class="social-pill" href="#"><span data-ic="pin"></span> Maps</a>
            </nav>
        </div>

        <a class="scroll-cue" href="#browse" aria-hidden="true">
            <span data-ic="chevronDown"></span>
        </a>
    </section>

    <main class="container" style="padding-top:2.5rem">

        <!-- Search -->
        <form class="search" id="landingSearch" role="search">
            <span data-ic="search" data-ic-class="search__icon"></span>
            <input id="landingSearchInput" type="search" data-i18n-ph="search" aria-label="Search the menu">
            <button class="search__go" type="submit" data-i18n-label="searchShort">
                <span data-ic="arrowRight"></span>
            </button>
        </form>

        <!-- Categories -->
        <section id="browse" style="padding-top:3rem">
            <div class="section-head section-head--center">
                <span class="eyebrow" data-i18n="theMenu"></span>
                <h2 class="section-title" data-i18n="browse"></h2>
                <p class="section-sub" data-i18n="browseSub"></p>
            </div>
            <div class="cat-grid" id="catGrid"></div>
        </section>

        <!-- Chef's picks -->
        <section style="padding-top:3.25rem">
            <div class="section-head">
                <span class="eyebrow" data-i18n="picksSub"></span>
                <h2 class="section-title" data-i18n="picks"></h2>
            </div>
            <div class="hscroll bleed" id="picksRow"></div>
        </section>

        <!-- Practical info -->
        <section style="padding-top:3rem">
            <div class="info-grid" id="infoGrid"></div>
        </section>

    </main>

    <footer class="footer">
        <div class="ornament" aria-hidden="true"><span></span></div>
        <div class="footer__mark">Lumière</div>
        <p>14 Rue Saint-Ange · +961 1 234 567</p>
        <p class="footer__note" id="footerNote"></p>
    </footer>

    <script src="icons.js"></script>
    <script src="data.js"></script>
    <script src="system.js"></script>
    <script src="script.js"></script>
</body>
</html>
